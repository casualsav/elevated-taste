name: deploy-site
# Build the exemplar directory in CI and publish to GitHub Pages (taste.extant.cc).
# This repo is public, so the site is built WITHOUT screenshots (--no-shots): captures
# stay private and are never committed or pushed here.
#
# One-time repo setup (Settings → Pages): Source = "GitHub Actions",
# Custom domain = taste.extant.cc (DNS: CNAME taste → casualsav.github.io).

on:
  push:
    branches: [main]
    paths: ['corpus/**/exemplars/**', 'sites/pages/**']
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Text-only build: the public site never includes captures (pictures of
      # other people's sites). Every exemplar renders as a card that links to
      # the live site, with its patterns and metadata.
      - name: Build site (text-only; strict refuses bad frontmatter or an empty site)
        run: |
          pip install --quiet pillow pyyaml
          PAGES_OUT="$PWD/dist" python3 sites/pages/build.py --strict --no-shots

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build pattern gallery (renders every recipe; broken recipes fail the deploy)
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node tooling/render-patterns.mjs --gallery "$PWD/dist/patterns"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
