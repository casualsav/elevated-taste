name: refresh
# Monthly staleness pass (docs: tooling/refresh.mjs) — re-captures the N oldest exemplars,
# reports dead sites, re-distills drifted ones and lands each that passes the gate on main in the
# same run (a failing one opens a refresh/<date>-<slug> PR labelled hold, as evolve does).
# Captures stay on the ephemeral runner and are never pushed; drift is judged against each site's
# fingerprint in corpus/fingerprints.json instead, which the run updates on main. Self-upgrading
# means CURRENT, not just bigger.

on:
  schedule:
    - cron: '0 10 5 * *' # 5th of each month, 10:00 UTC (off the Monday evolve cadence)
  workflow_dispatch:
    inputs:
      limit:
        description: 'how many oldest exemplars to re-check'
        required: false
        default: '3'

concurrency:
  group: evolve # both land on main — never overlap with an evolve run
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write # dispatch post-merge-derivations after landing

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm install -g @anthropic-ai/claude-code
      - run: pip install --quiet pillow # tooling/dhash.py (drift)

      - name: Configure git author
        run: |
          git config user.name "taste-evolve[bot]"
          git config user.email "taste-evolve@users.noreply.github.com"

      - name: Run refresh
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TASTE_GATE: off
        run: node tooling/refresh.mjs --limit "${{ github.event.inputs.limit || '3' }}"

      - name: Rebuild derived artifacts
        # Pushes made with GITHUB_TOKEN fire no `push` workflows, so kick it explicitly.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch -q origin main
          if [ "$(git rev-parse origin/main)" = "${{ github.sha }}" ]; then echo "nothing landed"; exit 0; fi
          gh workflow run post-merge.yml --ref main
