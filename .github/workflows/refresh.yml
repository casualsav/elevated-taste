name: refresh
# Monthly staleness pass (docs: tooling/refresh.mjs) — re-captures the N oldest exemplars,
# reports dead sites, re-distills drifted ones as refresh/<date>-<slug> PRs (same validator +
# render + 48h auto-merge gates as evolve PRs). Captures stay on the runner: this repo
# is public, so nothing is pushed to a captures branch. Self-upgrading means CURRENT.

on:
  schedule:
    - cron: '0 10 5 * *' # 5th of each month, 10:00 UTC (off the Monday evolve cadence)
  workflow_dispatch:
    inputs:
      limit:
        description: 'how many oldest exemplars to re-check'
        required: false
        default: '3'

concurrency:
  group: evolve # shares the working-tree semantics with evolve/auto-merge — never overlap
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm install -g @anthropic-ai/claude-code
      - run: pip install --quiet pillow

      - name: Configure git author
        run: |
          git config user.name "taste-evolve[bot]"
          git config user.email "taste-evolve@users.noreply.github.com"

      - name: Run refresh
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TASTE_GATE: off
        run: node tooling/refresh.mjs --limit "${{ github.event.inputs.limit || '3' }}"
      # No captures branch in this public repo, so there is no drift baseline:
      # refresh still reports dead sites, but can't judge visual drift.
