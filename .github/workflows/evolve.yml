name: evolve
# Weekly self-evolving ingestion — fully off-box (docs/UPGRADES.md §B).
# harvest → dedupe → resolve → capture → distill (subscription via CLAUDE_CODE_OAUTH_TOKEN)
# → one draft PR per site → optional Telegram digest.
#
# Required secret:  CLAUDE_CODE_OAUTH_TOKEN   (from `claude setup-token` — subscription auth, no API fees)
# Optional secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID (weekly digest)
#
# Note: PRs opened with the built-in GITHUB_TOKEN do not trigger PR-CI workflows —
# the auto-merge job (auto-merge.yml) re-runs the full validator per PR branch before
# merging, so the quality gate still applies.

on:
  schedule:
    - cron: '0 9 * * 1' # Mondays 09:00 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: 'max candidates this run'
        required: false
        default: '4'

concurrency:
  group: evolve
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # pr.mjs branches per site

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git author
        run: |
          git config user.name "taste-evolve[bot]"
          git config user.email "taste-evolve@users.noreply.github.com"

      - name: Run evolve
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TASTE_GATE: off
        run: node tooling/evolve.mjs --limit "${{ github.event.inputs.limit || '4' }}"
      # No captures push: this repo is public and captures (screenshots of other
      # people's sites) stay private. They exist only on the ephemeral runner.
