name: evolve
# Weekly self-evolving ingestion — fully off-box.
# harvest → dedupe → resolve → capture → distill (subscription via CLAUDE_CODE_OAUTH_TOKEN)
# → gate each site and land it on main (one commit per site), or open a PR labelled `hold`
# when it fails the gate → optional Telegram digest.
#
# Required secret:  CLAUDE_CODE_OAUTH_TOKEN   (from `claude setup-token` — subscription auth, no API fees)
# Optional secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID (weekly digest)
#
# The gate (reconcile-sources + validate + render-patterns --check) runs here, on each
# site's change merged onto main, because a PR or push made with GITHUB_TOKEN triggers no
# other workflow. For the same reason the run dispatches post-merge-derivations itself
# once anything has landed. Captures stay on the ephemeral runner: they are never pushed.

on:
  schedule:
    - cron: '0 9 * * 1' # Mondays 09:00 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: 'max candidates this run'
        required: false
        default: '4'

concurrency:
  group: evolve
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write # dispatch post-merge-derivations after landing

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # land.mjs works in per-site worktrees

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - run: pip install --quiet pillow # tooling/dhash.py (fingerprints for refresh drift)

      - name: Configure git author
        run: |
          git config user.name "taste-evolve[bot]"
          git config user.email "taste-evolve@users.noreply.github.com"

      - name: Run evolve
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TASTE_GATE: off
        run: node tooling/evolve.mjs --limit "${{ github.event.inputs.limit || '4' }}"

      - name: Rebuild derived artifacts
        # Pushes made with GITHUB_TOKEN fire no `push` workflows, so kick it explicitly.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch -q origin main
          if [ "$(git rev-parse origin/main)" = "${{ github.sha }}" ]; then echo "nothing landed"; exit 0; fi
          gh workflow run post-merge.yml --ref main
